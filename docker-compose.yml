version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: timesense_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PROCESS_FPS=5
      - LLM_API_KEY=${LLM_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: timesense_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
